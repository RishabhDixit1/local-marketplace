name: Deploy to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: serviq:latest
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package deploy artifact
        run: docker save serviq:latest | gzip > /tmp/serviq-docker.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: serviq-deploy
          path: /tmp/serviq-docker.tar.gz
          retention-days: 7

  deploy:
    needs: build
    if: false  # App deployment disabled — Vercel serves the web app. EC2 runs Supabase only.
              # To re-enable: change `if: false` to `if: true` (or remove the line).
              # This workflow now only deploys DB migrations to EC2.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: serviq-deploy
          path: ./

      - name: Verify artifact exists
        run: ls -lh serviq-docker.tar.gz

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: serviq-docker.tar.gz
          target: /home/ec2-user/serviq
          strip_components: 0

      - name: Copy migration files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: supabase/migrations/
          target: /home/ec2-user/serviq/migrations
          strip_components: 0

      - name: Apply DB migrations on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ec2-user/serviq

            echo "--- Applying pending database migrations ---"
            MIGRATIONS_DIR="/home/ec2-user/serviq/migrations/supabase/migrations"
            DB_CONTAINER=$(docker ps --filter "name=db" --filter "name=supabase" --format "{{.Names}}" | head -1)
            if [ -z "$DB_CONTAINER" ]; then
              DB_CONTAINER=$(docker ps --filter "ancestor=supabase/postgres" --format "{{.Names}}" | head -1)
            fi

            if [ -n "$DB_CONTAINER" ] && [ -d "$MIGRATIONS_DIR" ]; then
              DB_USER="postgres"
              for f in "$MIGRATIONS_DIR"/*.sql; do
                [ -f "$f" ] || continue
                echo "  Applying $(basename "$f")..."
                docker cp "$f" "$DB_CONTAINER:/tmp/$(basename "$f")"
                OUTPUT=$(docker exec "$DB_CONTAINER" psql -U "$DB_USER" -f "/tmp/$(basename "$f")" 2>&1) || true
                echo "$OUTPUT" | grep -i "error\|already exists\|skipped" | head -3 || true
                docker exec "$DB_CONTAINER" rm -f "/tmp/$(basename "$f")" 2>/dev/null || true
              done
              echo "--- Database migrations complete ---"
            else
              echo "WARNING: Could not find Supabase DB container or migration files. Skipping migrations."
              [ -z "$DB_CONTAINER" ] && echo "  (No database container found)"
              [ ! -d "$MIGRATIONS_DIR" ] && echo "  (Migrations dir $MIGRATIONS_DIR not found)"
            fi
          command_timeout: 5m
